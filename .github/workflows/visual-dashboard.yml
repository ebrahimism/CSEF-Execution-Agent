name: CSEF bilingual dashboard browser visuals

on:
  pull_request:
    paths:
      - "src/csef_gate/ui/**"
      - "tests/ui/**"
      - ".github/workflows/visual-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and browser test driver
        run: |
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run actual Chromium RTL/LTR and viewport tests
        run: python tests/ui/visual_browser.py
      - name: Upload desktop/mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csef-visual-dashboard-qa
          path: visual-artifacts/*.png
          if-no-files-found: warn
